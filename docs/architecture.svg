<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrdown" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <path d="M0,0 L3,8 L6,0" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="280" rx="10" fill="#0f172a"/>
  <text x="360" y="30" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Paper-Synth Architecture</text>

  <!-- Input -->
  <rect x="20" y="55" width="120" height="55" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="77" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">Abstracts</text>
  <text x="80" y="95" text-anchor="middle" fill="#64748b" font-size="9">JSON files (local)</text>

  <!-- Arrow to analysis -->
  <line x1="140" y1="82" x2="175" y2="82" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 5 Analysis streams -->
  <rect x="175" y="42" width="340" height="185" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="345" y="62" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">5 Parallel Analysis Passes</text>

  <rect x="195" y="72" width="140" height="26" rx="4" fill="#1e3b2f" stroke="#10b981" stroke-width="0.5"/>
  <text x="265" y="89" text-anchor="middle" fill="#6ee7b7" font-size="10">Topic Extractor</text>
  <text x="365" y="89" text-anchor="start" fill="#64748b" font-size="9">keyword grouping, min 2 papers</text>

  <rect x="195" y="104" width="140" height="26" rx="4" fill="#1e3b2f" stroke="#10b981" stroke-width="0.5"/>
  <text x="265" y="121" text-anchor="middle" fill="#6ee7b7" font-size="10">Consensus Detector</text>
  <text x="365" y="121" text-anchor="start" fill="#64748b" font-size="9">terms in &gt;50% of abstracts</text>

  <rect x="195" y="136" width="140" height="26" rx="4" fill="#1e3b2f" stroke="#10b981" stroke-width="0.5"/>
  <text x="265" y="153" text-anchor="middle" fill="#6ee7b7" font-size="10">Disagreement Finder</text>
  <text x="365" y="153" text-anchor="start" fill="#64748b" font-size="9">"however", "in contrast", etc.</text>

  <rect x="195" y="168" width="140" height="26" rx="4" fill="#1e3b2f" stroke="#10b981" stroke-width="0.5"/>
  <text x="265" y="185" text-anchor="middle" fill="#6ee7b7" font-size="10">Gap Identifier</text>
  <text x="365" y="185" text-anchor="start" fill="#64748b" font-size="9">"remains unclear", "future work"</text>

  <rect x="195" y="200" width="140" height="22" rx="4" fill="#1e3b2f" stroke="#10b981" stroke-width="0.5"/>
  <text x="265" y="215" text-anchor="middle" fill="#6ee7b7" font-size="10">Experiment Suggester</text>

  <!-- Arrow to report -->
  <line x1="515" y1="130" x2="555" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Report builder -->
  <rect x="555" y="70" width="140" height="120" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="625" y="92" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">Synthesis Report</text>
  <text x="625" y="112" text-anchor="middle" fill="#64748b" font-size="9">Topic sections</text>
  <text x="625" y="126" text-anchor="middle" fill="#64748b" font-size="9">Consensus points</text>
  <text x="625" y="140" text-anchor="middle" fill="#64748b" font-size="9">Disagreements</text>
  <text x="625" y="154" text-anchor="middle" fill="#64748b" font-size="9">Knowledge gaps</text>
  <text x="625" y="168" text-anchor="middle" fill="#64748b" font-size="9">Next experiments</text>
  <text x="625" y="182" text-anchor="middle" fill="#a78bfa" font-size="9">Markdown output</text>

  <!-- Footer -->
  <text x="360" y="260" text-anchor="middle" fill="#475569" font-size="10">Offline-first  |  no network  |  deterministic  |  structured Markdown reports</text>
</svg>
